# pg-migrate configuration file example

# Number of parallel jobs for pg_dump
dump_jobs = 12

# Number of parallel jobs for pg_restore
restore_jobs = 16

# (Optional) Use --single-transaction for pg_restore (default: true).
# Ensures the restore of each database is atomic and reduces "Xact committed"
# count, but disables parallel restore jobs (-j) for that database.
restore_single_transaction = true

# Maximum number of parallel database migrations
max_parallel = 16

# Optional: Number of parallel dump operations (defaults to max_parallel)
dump_parallel = 12

# Optional: Number of parallel restore operations (defaults to max_parallel)
restore_parallel = 16

# Root directory for database dumps
dump_root = "pg_dumps"

# Whether to migrate global objects (roles, etc.)
migrate_globals = true

# Tables whose data is migrated in a separate, delayed pass (e.g. large tables).
# Every table matching one of these patterns is dumped/restored after the
# regular tables and is only row-count-verified once that delayed pass finishes.
# Format: "DATABASE.SCHEMA.TABLE_PATTERN" (all three parts are required). SCHEMA
# and TABLE_PATTERN may use pg_dump wildcards (* matches any sequence, ? matches
# a single character); the schema must be given explicitly so tables in any
# schema can be targeted unambiguously (e.g. "mydb.audit.*").
delay_table_data = [
  "pdb1.public.table3",
  "pdb2.public.table*"
]

# Tables, schemas, or databases to entirely exclude from the migration.
# Uses the same pattern matching as delay_table_data. Matching entities are
# skipped by both regular and delayed passes, and are not created on the target.
# You can exclude an entire database ("DB"), an entire schema ("DB.SCHEMA"),
# or specific tables ("DB.SCHEMA.TABLE"). Wildcards (*, ?) are supported in
# the schema and table parts.
exclude = [
 "db5"
]

# Whether to perform fast verification
fast_verify = false

# Concurrency for verification phase
verify_concurrency = 16

# Zstd compression level for dumps (1-22)
zstd_level = 5

# TLS mode for native (tokio-postgres) connections: disable, prefer, or require.
# Mirrors libpq's sslmode. "prefer" (default) uses TLS when the server offers it
# and falls back to plaintext otherwise, so it works against both TLS and non-TLS
# servers. The server certificate is not verified (matching sslmode=prefer/require).
# Can be overridden on the command line with --sslmode.
sslmode = "prefer"

# Tables to copy using the copy engine instead of pg_dump/restore.
# A copy-engine table is treated as deferred automatically: it is excluded from
# the regular pg_dump, excluded from the delayed pg_dump, migrated by the copy
# engine, and only verified after the copy completes. It therefore does NOT need
# to be listed in delay_table_data, and listing it there (or matching it with a
# delay pattern) is harmless — the copy engine still wins and the delayed
# pg_dump still excludes it. Each table must be fully qualified as
# "DATABASE.SCHEMA.TABLE" (all three parts required). Multiple rules can target
# the same table (e.g. to split by time ranges).
[[copy_rules]]
table = "pdb1.public.table3"
split_by_column = "created_at"   # column used for WHERE / range splitting (default: created_at)
from = "2023-01-01 00:00:00"     # inclusive lower bound (optional; omit for no lower bound)
till = "2023-06-01 00:00:00"     # exclusive upper bound (optional; omit for no upper bound)

[[copy_rules]]
table = "pdb2.public.table3"
split_by_column = "created_at"
from = "2023-06-01 00:00:00"
