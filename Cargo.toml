[package]
name = "pg-migrate"
version = "0.7.13"
edition = "2024"
rust-version = "1.98"
description = "PostgreSQL migration tool"
license = "GPL-3.0-only"

[[bin]]
name = "pg-migrate"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"], optional = true }
env_logger = "0.11.11"
futures = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
futures-util = "0.3.34"
indicatif = "0.18.6"
indicatif-log-bridge = "0.2.3"
log = "0.4.34"
rustls = { version = "0.23.43", default-features = false, features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1", "with-chrono-0_4"] }
tokio-postgres-rustls = "0.14.0"
tokio-util = "0.7.19"
toml = "1.1.4"
wildmatch = "2.6.1"

[lints.rust]
linker_messages = "allow"
unsafe_code = "forbid"

[lints.clippy]
enum_glob_use = "deny"
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
needless_for_each = { level = "allow", priority = 1 }

[profile.dev]
debug = true
incremental = true
opt-level = 0

[profile.release]
codegen-units = 1
debug = false
lto = "fat"
opt-level = 3
panic = "abort"
strip = true

[profile.release.package."*"]
codegen-units = 1
debug = false
opt-level = 3
strip = true
