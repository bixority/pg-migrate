[package]
name = "pg-migrate"
version = "0.6.4"
edition = "2024"
description = "PostgreSQL migration tool"
license = "GPL-3.0-only"

[[bin]]
name = "pg-migrate"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive"], optional = true }
env_logger = "0.11.10"
futures = { version = "0.3.32", default-features = false, features = ["std", "async-await"] }
futures-util = "0.3.32"
indicatif = "0.18.4"
indicatif-log-bridge = "0.2.3"
log = "0.4.32"
rustls = { version = "0.23.40", default-features = false, features = ["ring"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tokio-postgres = { version = "0.7.17", features = ["with-serde_json-1", "with-chrono-0_4"] }
tokio-postgres-rustls = "0.14.0"
tokio-util = "0.7.18"
toml = "1.1.2"
wildmatch = "2.4.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
enum_glob_use = "deny"
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
needless_for_each = { level = "allow", priority = 1 }

[profile.dev]
debug = true
incremental = true
opt-level = 0

[profile.release]
codegen-units = 1
debug = false
lto = "fat"
opt-level = 3
panic = "abort"
strip = true

[profile.release.package."*"]
codegen-units = 1
debug = false
opt-level = 3
strip = true
